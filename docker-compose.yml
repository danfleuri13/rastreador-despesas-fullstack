version: '3.8'

services:
  # Configuração do Python
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app  # Mapeia sua pasta local para o container (Hot Reload)
    environment:
      - FLASK_ENV=development

  # Configuração do React
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app # Mapeia código local para hot reload
      - /app/node_modules # Evita conflito de node_modules entre Windows/Linux
    depends_on:
      - backend # Só inicia o front depois que o back existir